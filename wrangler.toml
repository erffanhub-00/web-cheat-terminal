name = "web-cheat-terminal"
main = "src/index.js"
compatibility_date = "2026-11-18"

# D1 database (SQLite on Cloudflare).
# Local dev uses a local SQLite file; for the real deploy, run:
#   wrangler d1 create cheat-terminal
# ...and replace the placeholder database_id below with the id it prints.
[[d1_databases]]
binding = "DB"
database_name = "cheat-terminal"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Static frontend (public/). The Worker serves API + /admin itself and lets
# the asset binding serve everything else.
[assets]
binding = "ASSETS"
directory = "./public"
