name = "web-cheat-terminal"
main = "src/index.js"
compatibility_date = "2026-11-18"

# D1 database (SQLite on Cloudflare). Already created; id below is the live one.
# If you ever need a fresh database: wrangler d1 create cheat-terminal,
# then put the new id here and re-run the migrations + seed.
[[d1_databases]]
binding = "DB"
database_name = "cheat-terminal"
database_id = "f5ed3d74-8468-4496-8e72-c80b12d1bbd7"
migrations_dir = "migrations"

# Static frontend (public/). The Worker serves API + /admin itself and lets
# the asset binding serve everything else.
[assets]
binding = "ASSETS"
directory = "./public"
